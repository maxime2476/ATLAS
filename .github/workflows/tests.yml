# Intégration continue : tests qui ne demandent pas les données brutes ni les panels (non versionnés).
# Les tests qui en ont besoin sont sautés automatiquement ; les contrôles d'empreinte des fichiers bruts aussi.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
      - name: Environnement Python figé par uv.lock
        run: uv sync --frozen
      - name: Tests sans données
        run: uv run pytest -q

  r-tests:
    # Tests du module d'inférence R (WCR, CV3, graines) ; ceux qui demandent le panel maïs sont sautés.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests R
        run: Rscript tests/test_r_inference.R
